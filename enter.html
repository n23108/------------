<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות למשחק</title>
    <script src="enter.js" defer></script>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        main {
            width: 100%;
            max-width: 420px;
            margin: 20px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        .form-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #b974ff 0%, #7a22ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        h3 {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: -5px;
            padding-right: 5px;
        }

        input {
            width: 100%;
            border-radius: 12px;
            padding: 15px 20px;
            text-align: right;
            background-color: #1a1a26;
            color: #ffffff;
            font-size: 1.1rem;
            border: 2px solid rgba(185, 116, 255, 0.2);
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #b974ff;
            background-color: #222235;
            box-shadow: 0 0 12px rgba(185, 116, 255, 0.3);
        }

        button {
            width: 100%;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            background: linear-gradient(135deg, #b974ff 0%, #8a36ff 100%);
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(138, 54, 255, 0.3);
            transition: all 0.2s ease;
            margin-top: 15px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(138, 54, 255, 0.5);
            background: linear-gradient(135deg, #ca91ff 0%, #9952ff 100%);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: 0 3px 10px rgba(138, 54, 255, 0.3);
        }

        .a {
            font-size: 1rem;
            color: #ff4b4b;
            text-align: center;
            font-weight: 600;
            min-height: 24px;
            margin-top: 5px;
            text-shadow: 0 0 8px rgba(255, 75, 75, 0.2);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .register-link a {
            color: #b974ff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .register-link a:hover {
            color: #ca91ff;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main>
        <div class="form-title">כניסה למערכת</div>
        
        <form action="">
            <h3>שם משתמש:</h3>
            <input type="text" class="user">
            
            <h3>סיסמה:</h3>
            <input type="password" class="pass">
            
            <button type="submit">כניסה</button>
            <div class="a"></div>
        </form>

        <div class="register-link">
            משתמש חדש? <a href="register.html">ליצירת חשבון לחץ כאן</a>
        </div>
    </main>
</body>
</html>
